name: 每周体检
# 合并了两个定时任务：链接体检（周六）和版本时效检查（周一）。
# 它们原本是两个文件，但都是"定时 + 手动触发 + 只读 + 报告"，合并后少一个 workflow，
# 排查问题时也不用在两个文件之间跳。
# 注意：pages.yml 保持独立 —— 它是 push 触发且需要 pages/id-token 写权限，
# 合并进来会把那些权限带给定时任务，没有必要。

on:
  schedule:
    # 链接体检：每周六 03:00 UTC = 北京时间周六 11:00
    - cron: '0 3 * * 6'
    # 版本时效：每周一 05:00 UTC = 北京时间周一 13:00
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      # ⚠️ 这条注释必须留在这里（YAML 层），绝不能写进下面的 args 里。
      # lychee-action 内部执行的是 `eval lychee ... $ARGS`，
      # args 中出现 # 会被 shell 当成注释开头，把后面所有参数
      # （包括扫描路径 './**/*.md'）全部吃掉，体检必然报
      # "required arguments were not provided: <inputs>" 并失败。
      - name: 扫描全仓库链接（lychee）
        id: lychee
        uses: lycheeverse/lychee-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 403/429/521 多为反爬或限流（CSDN、工信部备案站对 CI 常返回 521），
          # 视作“无法判定”而不是死链，避免每周误报
          args: >-
            --no-progress
            --timeout 20
            --max-retries 2
            --accept '200..=299,403,429,521'
            --exclude '.*127\.0\.0\.1.*'
            --exclude '.*localhost.*'
            --exclude '.*example\.com.*'
            --exclude '.*gh-proxy\.com.*'
            # CSDN 对境外机房 IP 直接 reset 连接（os error 104），不是死链。
            # 这类站点无法从 CI 判定存活，排除后由人工抽查。
            --exclude '.*csdn\.net.*'
            # 同类：国内社区的常见反爬拦截
            --exclude '.*jianshu\.com.*'
            --exclude '.*zhihu\.com.*'
            './**/*.md'
          output: lychee-report.md
          fail: true

      - name: 体检通过
        if: success()
        run: echo "全部链接存活，本次体检通过 ✅"

      - name: 发现死链 → 汇报 Issue（已有同名 Issue 则追加评论，不重复开）
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 防御：如果是工作流自身没跑起来（参数错、lychee 下载失败等），
          # 报告里不会有链接清单。这时不开 Issue，只让流水线红掉，
          # 避免像 2026-10-26 那次那样产出一个内容为空的假 Issue。
          if [ ! -s lychee-report.md ] || [ "$(wc -c < lychee-report.md)" -lt 200 ]; then
            echo "::error::lychee 没有产出有效报告，本次是工作流自身出错（不是死链），请看上方日志。"
            exit 1
          fi
          title="🔗 每周链接体检：发现失效链接，需要人工确认"
          number=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1 || true)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file lychee-report.md
          else
            gh issue create --title "$title" --body-file lychee-report.md
          fi

  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 探测上游最新版本并比对文档
        shell: pwsh
        run: ./scripts/check-versions.ps1

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: version-report
          path: version-report.txt
          if-no-files-found: ignore
