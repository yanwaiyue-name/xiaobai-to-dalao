name: 版本时效检查

on:
  schedule:
    # 每周一 05:00 UTC（北京时间 13:00），排在链接体检之后
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 探测上游最新版本并比对文档
        shell: pwsh
        run: ./scripts/check-versions.ps1

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: version-report
          path: version-report.txt
          if-no-files-found: ignore
